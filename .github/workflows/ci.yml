name: CI

on:
  push:
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secret-like values
        shell: bash
        run: |
          matches=$(git grep -n -I -E '(^|[^A-Za-z])(Bearer [A-Za-z0-9._-]{20,}|(SECRET|TOKEN|PASSWORD|PRIVATE_KEY)=.{8,})' -- ':!backend/.env.example' ':!*.lock' || true)
          if [ -n "$matches" ]; then echo "$matches"; exit 1; fi
