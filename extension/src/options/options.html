<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hover Sinhala Translator Settings</title><link rel="stylesheet" href="options.css"></head><body><main><h1>Hover Sinhala Translator</h1><p>Configure translations while you read.</p><form id="settings-form"><label>Enable translation <input id="enabled" type="checkbox"></label><label>Hover delay<select id="hover-delay"><option value="300">300ms</option><option value="500">500ms</option><option value="700">700ms</option><option value="1000">1000ms</option><option value="1500">1500ms</option><option value="2000">2000ms</option></select></label><label>Translation language<select id="target-language"><option value="si">Sinhala</option></select></label><label>Popup position<select id="popup-position"><option value="auto">Auto</option><option value="above">Above word</option><option value="below">Below word</option></select></label><fieldset><legend>Display</legend><label><input id="show-definition" type="checkbox"> Show definition</label><label><input id="show-part-of-speech" type="checkbox"> Show part of speech</label></fieldset><button type="submit">Save</button><button type="button" id="reset">Reset to defaults</button><p id="feedback" role="status"></p></form></main><script src="../../dist/settings/settingsManager.js"></script><script src="../../dist/options/options.js"></script></body></html>
